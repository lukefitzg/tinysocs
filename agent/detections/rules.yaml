- id: auth_failed_burst
  description: Multiple failed Windows logons (4625) from same IP/user in 2 hours
  index: "winlogbeat-*"
  kql: >
    event.code:4625 AND NOT source.ip:(127.0.0.1 OR "::1")
    AND NOT user.name:(NoSuchUser)
  threshold: 5

- id: sysmon_proc_creation
  description: Sysmon process creation events (ID 1)
  index: "winlogbeat-*"
  kql: 'event.code:1'
  threshold: 10

- id: ps_script_block
  description: PowerShell ScriptBlock logging (ID 4104)
  index: "winlogbeat-*"
  kql: 'event.code:4104'
  threshold: 3

- id: proc_creation_powershell_suspicious
  description: PowerShell with suspicious flags (4688 / Sysmon ID 1)
  index: "winlogbeat-*"
  kql: >
    event.code:(4688 OR 1) AND
    process.name:(powershell.exe pwsh.exe) AND
    process.command_line:(-EncodedCommand OR -enc OR -NoProfile OR -nop OR -WindowStyle Hidden OR -w hidden OR -Command)
  threshold: 1

- id: proc_creation_lolbins
  description: Possible LOLBIN execution (4688 / Sysmon 1) — rundll32, regsvr32, mshta, wmic
  index: "winlogbeat-*"
  kql: >
    event.code:(4688 OR 1) AND
    process.name:(rundll32.exe regsvr32.exe mshta.exe wmic.exe)
  threshold: 2

# Suspicious PowerShell flags (4688)
- id: suspicious_powershell
  description: Suspicious PowerShell flags (NoProfile, EncodedCommand, Hidden, Bypass)
  index: winlogbeat-*
  kql: >
    event.code: "4688" AND process.name: "powershell.exe" AND (
      winlog.event_data.CommandLine: "*-nop*" OR
      winlog.event_data.CommandLine: "*-noprofile*" OR
      winlog.event_data.CommandLine: "*-enc*" OR
      winlog.event_data.CommandLine: "*-encodedcommand*" OR
      winlog.event_data.CommandLine: "*-w hidden*" OR
      winlog.event_data.CommandLine: "*-windowstyle hidden*" OR
      winlog.event_data.CommandLine: "*-executionpolicy bypass*"
    )
  # group by user only (proc events often lack source.ip)
  group_by: ["user.name"]
  threshold: 1

# LOLBIN burst (4688)
- id: lolbin_execs
  description: Multiple LOLBIN executions in short window
  index: winlogbeat-*
  kql: >
    event.code: "4688" AND process.name: (
      "rundll32.exe" or "regsvr32.exe" or "mshta.exe" or "certutil.exe" or "powershell.exe" or "wmic.exe"
    )
  group_by: ["user.name"]
  threshold: 3

