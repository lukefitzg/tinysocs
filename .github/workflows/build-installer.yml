name: build-installer
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build C# agent
        shell: pwsh
        run: |
          .\scripts\Build-Agent.ps1

      - name: Upload C# agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinysocs-agent
          path: src/TinySocs.Agent/bin/Release/net8.0/win-x64/publish/TinySocs.Agent.exe
          if-no-files-found: error

      # Note: Full installer compile (ISCC) requires OpenSearch vendor payload (~300MB)
      # which is too large for CI runners. The Inno Setup compile step is left for
      # local builds or self-hosted runners with cached vendor artifacts.
      # Uncomment the block below when using a self-hosted runner:
      #
      # - name: Install Inno Setup
      #   run: choco install innosetup -y --no-progress
