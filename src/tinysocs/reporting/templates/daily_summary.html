<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinySocs Daily Summary</title>
</head>
<body style="margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f4f4f4;-webkit-font-smoothing:antialiased;">

<table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:600px;margin:20px auto;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);">

  <!-- Header -->
  <tr>
    <td style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#ffffff;padding:24px 32px;">
      <h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.3px;">TinySocs Daily Summary</h1>
      <p style="margin:6px 0 0;font-size:13px;color:#a0a0c0;">{{date}} &middot; {{period}}</p>
    </td>
  </tr>

  <!-- Body -->
  <tr>
    <td style="padding:24px 32px;">
      {{content}}
    </td>
  </tr>

  <!-- Footer -->
  <tr>
    <td style="padding:16px 32px;background:#f8f8fa;border-top:1px solid #eee;">
      <p style="margin:0;font-size:12px;color:#888;">
        Generated by <strong>TinySocs</strong> &middot;
        <a href="https://localhost:5602" style="color:#4a69bd;text-decoration:none;">Open Dashboards</a>
      </p>
    </td>
  </tr>

</table>

</body>
</html>
