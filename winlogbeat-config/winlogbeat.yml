###################### Winlogbeat Configuration Example ########################

# This file is an example configuration file highlighting only the most common
# options. The winlogbeat.reference.yml file from the same directory contains
# all the supported options with more comments. You can use it as a reference.
#
# Full reference:
# https://www.elastic.co/guide/en/beats/winlogbeat/index.html

# ======================== Winlogbeat specific options =========================

winlogbeat.event_logs:
  - name: Application
    ignore_older: 72h

  - name: System

  - name: Security

  - name: Microsoft-Windows-Sysmon/Operational

  - name: Windows PowerShell
    event_id: 400, 403, 600, 800

  - name: Microsoft-Windows-PowerShell/Operational
    event_id: 4103, 4104, 4105, 4106

  - name: ForwardedEvents
    tags: [forwarded]

# ====================== Elasticsearch template settings =======================

setup.template.settings:
  index.number_of_shards: 1
  #index.codec: best_compression
  #_source.enabled: false

# ================================== General ===================================

#name:
#tags: ["service-X", "web-tier"]
#fields:
#  env: staging

# ================================= Dashboards =================================
# To load sample dashboards, enable this and set the correct host in setup.kibana below.
#setup.dashboards.enabled: true

# =================================== Kibana / Dashboards ======================

setup.kibana:
  # --- Use this for ELASTICSEARCH + KIBANA (default) ---
  host: "http://localhost:5601"

  # --- Or, switch to OPENSEARCH DASHBOARDS (comment the line above, uncomment below) ---
  # host: "http://localhost:5602"

  #space.id:

# =============================== Elastic Cloud ================================
#cloud.id:
#cloud.auth:

# ================================== Outputs ===================================
# IMPORTANT: Enable ONLY ONE of the two blocks below at a time.

# ------------------------ Elasticsearch Output (DEFAULT) ----------------------
output.elasticsearch:
  # Elastic on Docker (no auth, dev)
  hosts: ["http://localhost:9200"]

  # If your Elasticsearch requires auth, uncomment:
  # username: "elastic"
  # password: "changeme"

  # Pipeline to route events to security, sysmon, or powershell pipelines.
  pipeline: "winlogbeat-%{[agent.version]}-routing"

# ------------------------ OpenSearch Output (TOGGLE ON) -----------------------
# To send to OpenSearch instead of Elasticsearch:
# Comment the entire block above (output.elasticsearch) and uncomment this block.
#
#output.elasticsearch:
#  # OpenSearch on Docker (dev, http; we mapped 9201->9200)
#  hosts: ["http://localhost:9201"]
#
#  # Default demo credentials from our compose
#  username: "admin"
#  password: "ChangeMe123!"
#
#  # Keep the same routing pipeline name for parity
#  pipeline: "winlogbeat-%{[agent.version]}-routing"

# ------------------------------ Logstash Output -------------------------------
# If you ever want to dual-ship to BOTH Elastic and OpenSearch, use Logstash.
# Winlogbeat -> Logstash -> (Elasticsearch + OpenSearch outputs)
#output.logstash:
#  hosts: ["localhost:5044"]
#  #ssl.certificate_authorities: ["/etc/pki/root/ca.pem"]
#  #ssl.certificate: "/etc/pki/client/cert.pem"
#  #ssl.key: "/etc/pki/client/cert.key"

# ================================= Processors =================================
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~

# ================================== Logging ===================================
#logging.level: info
#logging.selectors: ["*"]

