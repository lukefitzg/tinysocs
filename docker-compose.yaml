# docker-compose.yaml
services:
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: ts-opensearch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Align admin password with golden SIEM creds
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${SIEM_PASS}
      # Heap tuned to reduce circuit-breaker trips (adjust to your host)
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - plugins.security.disabled=false
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.transport.enforce_hostname_verification=false
    ports:
      - "9201:9200"   # direct access (dev)
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -u ${SIEM_USER}:${SIEM_PASS} https://localhost:9200/_cluster/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 60

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: ts-opensearch-dashboards
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=${SIEM_USER}
      - OPENSEARCH_PASSWORD=${SIEM_PASS}
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "5602:5601"   # direct access (dev)
    depends_on:
      opensearch:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Reverse proxy (Phase 4): TLS term + clean public ports 80/443
  # Uncomment this block and the depends_on lines when you're ready.
  #
  # reverse-proxy:
  #   image: caddy:2.8.4
