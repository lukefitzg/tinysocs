      process.name:(ipconfig.exe netstat.exe arp.exe route.exe nslookup.exe systeminfo.exe)
      OR process.executable:(*\\ipconfig.exe *\\netstat.exe *\\arp.exe *\\route.exe *\\nslookup.exe *\\systeminfo.exe)
      OR winlog.event_data.NewProcessName:(*\\ipconfig.exe *\\netstat.exe *\\arp.exe *\\route.exe *\\nslookup.exe *\\systeminfo.exe)
    )
  group_by: ["host.name","user.name"]
