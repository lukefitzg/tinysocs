# TinySocs Action Snippets v1
# Map rule-id -> list of action blocks (label + cmd).
# Placeholders use <angle brackets> for operator fill-in.

auth_failed_burst:
  - label: Disable user (AD)
    cmd: Disable-ADAccount -Identity <user>
  - label: Reset password (AD)
    cmd: Set-ADAccountPassword -Identity <user> -Reset -NewPassword (Read-Host -AsSecureString)
  - label: Lock IP at Windows Firewall (temporary)
    cmd: netsh advfirewall firewall add rule name="TinySOCS Block <ip>" dir=in action=block remoteip=<ip>

script_block_volume:
  - label: Review ScriptBlock volume by host
    cmd: Get-WinEvent -FilterHashtable @{LogName="Microsoft-Windows-PowerShell/Operational"; Id=4104} -MaxEvents 50 | Group-Object MachineName | Sort-Object Count -Descending
  - label: Identify top ScriptBlock sources
    cmd: Get-WinEvent -FilterHashtable @{LogName="Microsoft-Windows-PowerShell/Operational"; Id=4104} -MaxEvents 100 | ForEach-Object {$_.Properties[0].Value.Substring(0,100)} | Group-Object | Sort-Object Count -Descending | Select-Object -First 20

sysmon_proc_creation:
  - label: Review process creation events on host
    cmd: Get-WinEvent -FilterHashtable @{LogName="Microsoft-Windows-Sysmon/Operational"; Id=1} -MaxEvents 50 | Format-List
  - label: Identify most frequent processes
    cmd: Get-WinEvent -FilterHashtable @{LogName="Microsoft-Windows-Sysmon/Operational"; Id=1} -MaxEvents 200 | ForEach-Object {$_.Properties[4].Value} | Group-Object | Sort-Object Count -Descending | Select-Object -First 20

ps_script_block:
  - label: Pull ScriptBlock transcript for host
    cmd: Get-WinEvent -LogName "Microsoft-Windows-PowerShell/Operational" | Where-Object {$_.Id -eq 4104 -and $_.MachineName -eq "<host>"} | Select-Object -First 50 | Format-List
  - label: Constrain PowerShell (AppLocker/WDAC)
    cmd: Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" -Name "EnableConstrainedLanguage" -Value 1
  - label: Isolate host (EDR)
    cmd: crowdstrike RTR isolate --device <device_id>

proc_creation_powershell_suspicious:
  - label: Inspect process tree
    cmd: Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4688} | Where-Object {$_.Properties[5].Value -like "*<proc>*"} | Select-Object -First 50
  - label: Add Defender block (path/hash)
    cmd: Add-MpPreference -AttackSurfaceReductionOnlyExclusions "<path or hash>"

proc_creation_lolbins:
  - label: Capture suspicious binary + command line
    cmd: Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4688} | Where-Object {$_.Properties[5].Value -match "(rundll32|regsvr32|mshta|wmic)"} | Select-Object -First 50

suspicious_powershell:
  - label: Dump recent PS 4688 events
    cmd: Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4688} | Where-Object {$_.Properties[5].Value -like "*powershell.exe*"} | Select-Object -First 50

lolbin_execs:
  - label: Review LOLBIN executions on host
    cmd: Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4688} | Where-Object {$_.MachineName -eq "<host>"} | Select-Object -First 50

local_admin_create:
  - label: Remove from Administrators
    cmd: net localgroup Administrators "<user>" /delete
  - label: Disable local account
    cmd: net user "<user>" /active:no

scheduled_task_creation:
  - label: Query scheduled task
    cmd: schtasks /Query /TN "<taskname>" /V /FO LIST
  - label: Delete scheduled task
    cmd: schtasks /Delete /TN "<taskname>" /F

wmi_process_creation:
  - label: Query WMI consumers
    cmd: Get-WMIObject -Namespace "root\subscription" -Class __EventConsumer
  - label: Remove suspicious consumer
    cmd: '# Remove-WMIObject -Namespace "root\subscription" -Class __EventConsumer -Filter "Name='' <name> ''"'

suspicious_svchost:
  - label: List child processes of svchost
    cmd: Get-WinEvent -LogName Security | Where-Object {$_.Id -eq 4688 -and $_.Properties[4].Value -like "*\\svchost.exe"} | Select-Object -First 50

powershell_web_dl:
  - label: Block egress for host temporarily
    cmd: netsh advfirewall firewall add rule name="TinySOCS Egress Block <host>" dir=out action=block remoteip=any program=C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe

ps_transcription_off:
  - label: Re-enable PowerShell transcription
    cmd: Set-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription" -Name "EnableTranscripting" -Value 1
  - label: Check transcription policy
    cmd: Get-ItemProperty -Path "HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\Transcription" -ErrorAction SilentlyContinue | Format-List

scriptblock_base64:
  - label: Decode and review base64 content
    cmd: Get-WinEvent -FilterHashtable @{LogName="Microsoft-Windows-PowerShell/Operational"; Id=4104} -MaxEvents 20 | Where-Object {$_.Message -match "[A-Za-z0-9+/]{200,}"} | Select-Object -First 5 | Format-List
  - label: Enable Constrained Language Mode
    cmd: Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" -Name "__PSLockdownPolicy" -Value 4

vpn_geo_impossible:
  - label: Force password reset
    cmd: Set-ADAccountPassword -Identity <user> -Reset -NewPassword (Read-Host -AsSecureString)
  - label: Revoke active sessions (IdP)
    cmd: az ad user revoke-signins --id <userUPN>   # example (Azure AD)

firewall_deny_burst:
  - label: Confirm deny rule intent
    cmd: '# review firewall policy that created the denies, ensure destination is expected'

m365_mfa_fatigue:
  - label: Disable sign-in temporarily
    cmd: az ad user update --id <userUPN> --account-enabled false
  - label: Reset MFA
    cmd: '# Use Microsoft Graph/Portal to reset strong auth methods'

m365_mail_forward_rule:
  - label: List inbox rules
    cmd: Get-InboxRule -Mailbox "<userUPN>"
  - label: Remove forward rule
    cmd: Remove-InboxRule -Mailbox "<userUPN>" -Identity "<ruleName>"

# ── Phase 13: Credential Access ──

lsass_access:
  - label: Identify accessing process
    cmd: Get-WinEvent -FilterHashtable @{LogName="Microsoft-Windows-Sysmon/Operational"; Id=10} | Where-Object {$_.Properties[5].Value -like "*lsass.exe"} | Select-Object -First 20 | Format-List
  - label: Kill offending process
    cmd: Stop-Process -Name "<process>" -Force
  - label: Enable Credential Guard
    cmd: Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\LSA" -Name "RunAsPPL" -Value 1

credential_dumping_tools:
  - label: Quarantine binary
    cmd: Move-Item -Path "<path>" -Destination "C:\ProgramData\TinySocs\Quarantine\"
  - label: Kill process immediately
    cmd: Stop-Process -Name "<process>" -Force
  - label: Isolate host (EDR)
    cmd: crowdstrike RTR isolate --device <device_id>

ntds_dit_access:
  - label: Review VSS snapshots
    cmd: vssadmin list shadows
  - label: Delete suspicious VSS snapshot
    cmd: vssadmin delete shadows /shadow=<shadow_id>
  - label: Check for ntdsutil usage
    cmd: Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4688} | Where-Object {$_.Properties[5].Value -like "*ntdsutil*"} | Select-Object -First 20

# ── Phase 13: Lateral Movement ──

psexec_usage:
  - label: Identify PsExec service
    cmd: Get-WinEvent -FilterHashtable @{LogName="System"; Id=7045} | Where-Object {$_.Properties[0].Value -like "*PSEXE*"} | Select-Object -First 20
  - label: Remove PsExec service
    cmd: sc.exe delete PSEXESVC
  - label: Block PsExec via AppLocker
    cmd: '# Add AppLocker rule to block psexec.exe execution'

rdp_brute_force:
  - label: Block source IP at firewall
    cmd: netsh advfirewall firewall add rule name="TinySOCS Block RDP <ip>" dir=in action=block remoteip=<ip>
  - label: Restrict RDP to specific IPs (NLA)
    cmd: Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1
  - label: Disable RDP temporarily
    cmd: Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 1

remote_service_install:
  - label: Inspect installed service
    cmd: Get-WmiObject Win32_Service | Where-Object {$_.Name -eq "<service>"} | Format-List *
  - label: Stop and disable service
    cmd: Stop-Service -Name "<service>" -Force; Set-Service -Name "<service>" -StartupType Disabled

# ── Phase 13: Defence Evasion ──

event_log_cleared:
  - label: Investigate who cleared the log
    cmd: Get-WinEvent -FilterHashtable @{LogName="Security"; Id=1102} | Select-Object -First 10 | Format-List
  - label: Enable log forwarding (prevent future gaps)
    cmd: '# Configure Windows Event Forwarding to a remote collector'

defender_tamper:
  - label: Re-enable real-time protection
    cmd: Set-MpPreference -DisableRealtimeMonitoring $false
  - label: Review Defender exclusions
    cmd: Get-MpPreference | Select-Object -ExpandProperty ExclusionPath
  - label: Remove suspicious exclusion
    cmd: Remove-MpPreference -ExclusionPath "<path>"

amsi_bypass:
  - label: Review ScriptBlock content
    cmd: Get-WinEvent -FilterHashtable @{LogName="Microsoft-Windows-PowerShell/Operational"; Id=4104} | Where-Object {$_.Message -match "AmsiUtils|amsiInitFailed"} | Select-Object -First 10 | Format-List
  - label: Enable Constrained Language Mode
    cmd: Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" -Name "__PSLockdownPolicy" -Value 4
  - label: Block PowerShell for non-admins (AppLocker)
    cmd: '# Add AppLocker deny rule for powershell.exe targeting standard users'

timestomp_detected:
  - label: Inspect modified file
    cmd: Get-WinEvent -FilterHashtable @{LogName="Microsoft-Windows-Sysmon/Operational"; Id=2} | Select-Object -First 20 | Format-List
  - label: Quarantine suspicious file
    cmd: Move-Item -Path "<file>" -Destination "C:\ProgramData\TinySocs\Quarantine\"

# ── Phase 13: Persistence ──

service_install_suspicious:
  - label: Inspect service details
    cmd: Get-WmiObject Win32_Service | Where-Object {$_.Name -eq "<service>"} | Format-List *
  - label: Stop and remove service
    cmd: Stop-Service -Name "<service>" -Force; sc.exe delete "<service>"

registry_run_key:
  - label: List Run key entries
    cmd: Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" | Format-List
  - label: Remove suspicious entry
    cmd: Remove-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" -Name "<valuename>"

startup_folder_write:
  - label: List Startup folder contents
    cmd: Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup" | Format-List
  - label: Remove suspicious shortcut/binary
    cmd: Remove-Item -Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\<filename>" -Force

# ── Phase 13: Exfiltration ──

dns_tunnel_volume:
  - label: Review DNS queries
    cmd: Get-WinEvent -FilterHashtable @{LogName="Microsoft-Windows-Sysmon/Operational"; Id=22} | Where-Object {$_.Properties[4].Value -like "*<domain>*"} | Select-Object -First 50
  - label: Block domain at DNS
    cmd: Add-DnsServerQueryResolutionPolicy -Name "Block_<domain>" -Action DENY -FQDN "EQ,*.<domain>"

large_outbound_transfer:
  - label: Identify destination IPs
    cmd: Get-WinEvent -FilterHashtable @{LogName="Microsoft-Windows-Sysmon/Operational"; Id=3} | Where-Object {$_.Properties[6].Value -eq "<image>"} | Select-Object -First 50 | Format-List
  - label: Block outbound for process
    cmd: netsh advfirewall firewall add rule name="TinySOCS Block Egress <image>" dir=out action=block program="<image>"

# ── Phase 15: File Integrity Monitoring ──

fim_critical_file_modified:
  - label: Compare file hash with known-good
    cmd: Get-FileHash -Path "<filepath>" -Algorithm SHA256
  - label: Restore from backup
    cmd: Copy-Item -Path "<backup_path>" -Destination "<filepath>" -Force

fim_mass_modification:
  - label: Isolate host immediately
    cmd: netsh advfirewall set allprofiles firewallpolicy blockinbound,blockoutbound
  - label: List recently modified files
    cmd: Get-ChildItem -Path "<monitored_path>" -Recurse | Where-Object {$_.LastWriteTime -gt (Get-Date).AddMinutes(-5)} | Select-Object FullName, LastWriteTime

fim_config_tampered:
  - label: Review TinySocs config changes
    cmd: Get-Content -Path "<filepath>" | Select-Object -First 50
  - label: Restore TinySocs config from installer backup
    cmd: Copy-Item -Path "C:\ProgramData\TinySocs\backup\<configname>" -Destination "<filepath>" -Force

fim_sensitive_file_deleted:
  - label: Check Windows backup/VSS for recovery
    cmd: vssadmin list shadows
  - label: Verify file is truly missing
    cmd: Test-Path -Path "<filepath>"

fim_executable_replaced:
  - label: Check file signature and hash
    cmd: Get-AuthenticodeSignature -FilePath "<filepath>"; Get-FileHash -Path "<filepath>"
  - label: Compare with known-good backup
    cmd: vssadmin list shadows

fim_permission_change:
  - label: Review current ACL on the file
    cmd: Get-Acl -Path "<filepath>" | Format-List
  - label: Check who modified permissions recently
    cmd: Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4670} -MaxEvents 20 | Format-List

# ── Phase 15 M3: Gap-Coverage ──

account_discovery:
  - label: Review recent account enumeration
    cmd: Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4688} -MaxEvents 100 | Where-Object {$_.Properties[5].Value -match "net\.exe|whoami\.exe"} | Format-List
  - label: Check for suspicious user sessions
    cmd: query user

system_network_discovery:
  - label: Review network enumeration commands
    cmd: Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4688} -MaxEvents 100 | Where-Object {$_.Properties[5].Value -match "ipconfig|netstat|arp|route"} | Format-List
  - label: Check for reconnaissance tools
    cmd: Get-Process | Where-Object {$_.ProcessName -match "nmap|masscan|angry"}

ingress_tool_transfer:
  - label: Check recent file downloads
    cmd: Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4688} -MaxEvents 50 | Where-Object {$_.Properties[5].Value -match "certutil|bitsadmin|curl"} | Format-List
  - label: Block download utility
    cmd: netsh advfirewall firewall add rule name="TinySOCS Block <tool>" dir=out action=block program="C:\Windows\System32\<tool>.exe"

process_injection_sysmon:
  - label: Identify injection source process
    cmd: Get-WinEvent -FilterHashtable @{LogName="Microsoft-Windows-Sysmon/Operational"; Id=8} -MaxEvents 20 | Format-List
  - label: Kill suspicious source process
    cmd: Stop-Process -Name "<processname>" -Force

obfuscated_command_line:
  - label: Decode and review command
    cmd: Get-WinEvent -FilterHashtable @{LogName="Security"; Id=4688} -MaxEvents 50 | Where-Object {$_.Properties[8].Value -match '\^|``|\$env:'} | Format-List
  - label: Block suspicious script execution
    cmd: Set-MpPreference -AttackSurfaceReductionRules_Ids D4F940AB-401B-4EFC-AADC-AD5F3C50688A -AttackSurfaceReductionRules_Actions Enabled