map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream opensearch_upstream { server ts-opensearch:9200; keepalive 64; }
server {
    listen 9201 ssl http2;
    server_name siem.lan;
    ssl_certificate     /etc/nginx/certs/siem_lan.crt;
    ssl_certificate_key /etc/nginx/certs/siem_lan.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/opensearch_access.log;
    error_log  /var/log/nginx/opensearch_error.log;
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limit request body size (100MB for bulk indexing)
    client_max_body_size 100m;

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300;
        proxy_pass http://opensearch_upstream;
    }
}
