  # ── Process Creation (Windows Security 4688) ────────────────────────

  - id: "TS-040"
    name: "process_creation_burst"
    description: "Burst of process creation events (4688) from same user"
    severity: "low"
    enabled: true
    type: threshold_by_key
    condition:
      event_id: 4688
      channel: Security
      group_by: "winlog.event_data.SubjectUserName"
