cluster.name: tinysocs-local
node.name: tinysocs-node-1

network.host: 127.0.0.1
http.port: 9200
transport.port: 9300

discovery.type: single-node

# Make sure Security is NOT disabled
plugins.security.disabled: false

########## OpenSearch Security TLS (PKCS12) ##########
# NOTE: passwords are stored in opensearch.keystore, not in this file.

# Transport (node-to-node) TLS — REQUIRED
plugins.security.ssl.transport.keystore_type: PKCS12
plugins.security.ssl.transport.keystore_filepath: certs/node.p12
plugins.security.ssl.transport.keystore_alias: node

plugins.security.ssl.transport.truststore_type: PKCS12
plugins.security.ssl.transport.truststore_filepath: certs/trust.p12
plugins.security.ssl.transport.truststore_alias: tinysocs-ca

# For localhost/dev this avoids SAN/hostname pain. Tighten later for multi-node.
plugins.security.ssl.transport.enforce_hostname_verification: false

# HTTP (client-to-node) TLS — recommended
plugins.security.ssl.http.enabled: true
plugins.security.ssl.http.keystore_type: PKCS12
plugins.security.ssl.http.keystore_filepath: certs/node.p12
plugins.security.ssl.http.keystore_alias: node

plugins.security.ssl.http.truststore_type: PKCS12
plugins.security.ssl.http.truststore_filepath: certs/trust.p12
plugins.security.ssl.http.truststore_alias: tinysocs-ca

# Don’t require client certs for normal REST usage (admin cert is for securityadmin tooling)
plugins.security.ssl.http.clientauth_mode: NONE

# Bootstrap the security index on first start (installer can flip this off later)
plugins.security.allow_default_init_securityindex: true

# Tell Security which cert DN is allowed to run admin operations
plugins.security.authcz.admin_dn:
  - "CN=tinysocs-admin,OU=TinySocs,O=TinySocs,L=Dublin,ST=Dublin,C=IE"

# Tell Security which cert DN(s) are valid cluster nodes
plugins.security.nodes_dn:
  - "CN=tinysocs-node-1,OU=TinySocs,O=TinySocs,L=Dublin,ST=Dublin,C=IE"

# Optional but useful (later tighten roles)
plugins.security.restapi.roles_enabled: ["all_access","security_rest_api_access"]

########## Disk Watermarks ##########
# Prevent shard allocation when disk is filling up.
# low:  stop allocating NEW shards to this node
# high: start relocating EXISTING shards off this node
# flood: make indices read-only to prevent data loss
cluster.routing.allocation.disk.watermark.low: 80%
cluster.routing.allocation.disk.watermark.high: 85%
cluster.routing.allocation.disk.watermark.flood_stage: 90%
cluster.routing.allocation.disk.watermark.flood_stage.frozen: 95%
cluster.info.update.interval: 60s