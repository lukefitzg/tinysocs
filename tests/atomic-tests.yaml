# tests/atomic-tests.yaml
# Mapping of Atomic Red Team technique tests to TinySocs detection rules.
# Used by Test-AtomicDetection.ps1 to validate detection coverage.
#
# Each entry specifies:
#   - atomic_technique: MITRE ATT&CK technique ID
#   - technique_name: Human-readable name
#   - atomic_test_number: Which Atomic test to run (1-based index)
#   - expected_rules: TinySocs rule IDs that should fire
#   - sysmon_required: Whether Sysmon must be installed for detection
#   - timeout_seconds: How long to wait for the detection pipeline
#   - fallback_command: PowerShell command to run if ART has no Windows atomic
#   - notes: Additional context

tests:
  - atomic_technique: "T1110.001"
    technique_name: "Brute Force - Password Guessing"
    atomic_test_number: 1
    expected_rules: ["TS-001", "TS-001-lab", "TS-002"]
    sysmon_required: false
    timeout_seconds: 120
    fallback_command: "1..6 | ForEach-Object { net use \\\\127.0.0.1\\IPC$ /user:fakeuser \"WrongPass$_\" 2>$null; Start-Sleep -Milliseconds 500 }"
    notes: "Generates failed logon events (4625). Threshold: 5 in 5min. Fallback runs 6 net use attempts."

  - atomic_technique: "T1003.001"
    technique_name: "OS Credential Dumping - LSASS Memory"
    atomic_test_number: 1
    expected_rules: ["TS-060", "TS-061"]
    sysmon_required: true
    timeout_seconds: 120
    fallback_command: "Start-Process cmd.exe -ArgumentList '/c','tasklist /fi \"imagename eq lsass.exe\"' -Wait -ErrorAction SilentlyContinue; Start-Process cmd.exe -ArgumentList '/c','rundll32.exe comsvcs.dll MiniDump' -Wait -ErrorAction SilentlyContinue"
    notes: "Triggers Sysmon Event 10 targeting lsass.exe. Requires admin. Fallback runs tasklist/rundll32 to generate 4688 events."

  - atomic_technique: "T1059.001"
    technique_name: "Command and Scripting Interpreter - PowerShell"
    atomic_test_number: 1
    expected_rules: ["TS-030", "TS-030-lab", "TS-082"]
    sysmon_required: false
    timeout_seconds: 120
    fallback_command: "1..5 | ForEach-Object { Start-Process powershell.exe -ArgumentList '-Command','Write-Host ART-ScriptBlock-$_; Get-Process | Out-Null' -Wait -ErrorAction SilentlyContinue; Start-Sleep -Milliseconds 300 }"
    notes: "Generates ScriptBlock logging (4104). Runs 5 iterations for threshold. TS-030-lab threshold=2, TS-082 threshold=1 (AMSI bypass pattern). Fallback uses Start-Process to avoid error propagation."

  - atomic_technique: "T1053.005"
    technique_name: "Scheduled Task/Job - Scheduled Task"
    atomic_test_number: 1
    expected_rules: ["TS-020", "TS-061", "TS-132"]
    sysmon_required: false
    prefer_fallback: true
    timeout_seconds: 120
    fallback_command: "schtasks /create /tn \"TinySocs-ART-Test\" /tr \"cmd /c whoami\" /sc once /st 23:59 /f; Start-Sleep -Seconds 3; $evt4698 = Get-WinEvent -LogName Security -MaxEvents 100 -ErrorAction SilentlyContinue | Where-Object { $_.Id -eq 4698 }; if ($evt4698) { Write-Host \"DIAG: Event 4698 found ($($evt4698.Count) events)\" } else { Write-Host \"DIAG: Event 4698 NOT in Security log - audit policy may not be effective\" }; Start-Sleep -Seconds 2; schtasks /delete /tn \"TinySocs-ART-Test\" /f"
    notes: "Creates a scheduled task, generating event 4698. TS-020 targets 4698 directly; TS-061/TS-132 detect schtasks.exe process creation (4688) as fallback. Agent may have XML parsing issue with 4698 TaskContent field."

  - atomic_technique: "T1547.001"
    technique_name: "Boot or Logon Autostart Execution - Registry Run Keys"
    atomic_test_number: 1
    expected_rules: ["TS-091"]
    sysmon_required: true
    timeout_seconds: 120
    notes: "Modifies Run/RunOnce registry key. Requires Sysmon Event 13."

  - atomic_technique: "T1543.003"
    technique_name: "Create or Modify System Process - Windows Service"
    atomic_test_number: 1
    expected_rules: ["TS-090", "TS-072"]
    sysmon_required: false
    timeout_seconds: 120
    fallback_command: "sc.exe create TinySocsARTtest binPath= \"C:\\Windows\\Temp\\art-test.exe\" start= demand type= own; Start-Sleep -Seconds 5; sc.exe delete TinySocsARTtest"
    notes: "Installs a service with suspicious path. Generates event 7045. Fallback creates test service directly."

  - atomic_technique: "T1070.001"
    technique_name: "Indicator Removal - Clear Windows Event Logs"
    atomic_test_number: 1
    expected_rules: ["TS-080", "TS-080-sys"]
    sysmon_required: false
    prefer_fallback: true
    timeout_seconds: 120
    fallback_command: "wevtutil cl Security; Start-Sleep -Seconds 3; $evt1102 = Get-WinEvent -LogName Security -MaxEvents 20 -ErrorAction SilentlyContinue | Where-Object { $_.Id -eq 1102 }; if ($evt1102) { Write-Host \"DIAG: Event 1102 found after log clear\" } else { Write-Host \"DIAG: Event 1102 NOT in Security log after clear\" }; $evt104 = Get-WinEvent -LogName System -MaxEvents 20 -ErrorAction SilentlyContinue | Where-Object { $_.Id -eq 104 }; if ($evt104) { Write-Host \"DIAG: Event 104 found in System log\" } else { Write-Host \"DIAG: Event 104 NOT in System log\" }"
    notes: "Clears the Security event log. Detects via event 1102 (Security) or event 104 (System). System-channel detection (TS-080-sys) is more reliable as it is unaffected by the Security log clear."

  - atomic_technique: "T1562.001"
    technique_name: "Impair Defenses - Disable or Modify Tools"
    atomic_test_number: 1
    expected_rules: ["TS-081"]
    sysmon_required: false
    requires: "tamper_protection_disabled"
    timeout_seconds: 120
    fallback_command: "Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue; Start-Sleep -Seconds 3; $evt5001 = Get-WinEvent -LogName 'Microsoft-Windows-Windows Defender/Operational' -MaxEvents 20 -ErrorAction SilentlyContinue | Where-Object { $_.Id -eq 5001 }; if ($evt5001) { Write-Host \"DIAG: Event 5001 found (Defender disabled)\" } else { Write-Host \"DIAG: Event 5001 NOT found - Tamper Protection may be blocking\" }; Set-MpPreference -DisableRealtimeMonitoring $false -ErrorAction SilentlyContinue"
    notes: "Disables Windows Defender real-time protection. Requires Tamper Protection to be disabled. Confirmed: Tamper Protection blocks Set-MpPreference on this VM."

  - atomic_technique: "T1021.002"
    technique_name: "Remote Services - SMB/Windows Admin Shares"
    atomic_test_number: 1
    expected_rules: ["TS-070", "TS-072"]
    sysmon_required: false
    timeout_seconds: 120
    fallback_command: "sc.exe create PSEXESVC binPath= \"C:\\Windows\\PSEXESVC.exe\" start= demand type= own 2>$null; Start-Sleep -Seconds 3; sc.exe delete PSEXESVC 2>$null; net use \\\\127.0.0.1\\ADMIN$ 2>$null; net use \\\\127.0.0.1\\C$ 2>$null"
    notes: "Simulates PsExec by creating PSEXESVC service (generates event 7045). Also accesses admin shares."

  - atomic_technique: "T1136.001"
    technique_name: "Create Account - Local Account"
    atomic_test_number: 1
    expected_rules: ["TS-010"]
    sysmon_required: false
    timeout_seconds: 120
    fallback_command: "net user TinySocsART P@ssw0rd123! /add 2>$null; Start-Sleep -Seconds 5; net user TinySocsART /delete 2>$null"
    notes: "Creates a new local user account, generating event 4720. Fallback uses net user directly."

  - atomic_technique: "T1218.011"
    technique_name: "System Binary Proxy Execution - Rundll32"
    atomic_test_number: 1
    expected_rules: ["TS-135", "TS-061", "TS-132"]
    sysmon_required: false
    timeout_seconds: 120
    fallback_command: "Start-Process rundll32.exe -ArgumentList 'url.dll,OpenURL','https://127.0.0.1:9999/not-real' -Wait -ErrorAction SilentlyContinue; Start-Process rundll32.exe -ArgumentList 'advpack.dll,LaunchINFSection' -Wait -ErrorAction SilentlyContinue"
    notes: "Executes rundll32 with suspicious arguments. Detected via 4688 process creation (TS-135 preferred, TS-061/TS-132 fallback). Uses Start-Process to ensure 4688 events are generated."

  - atomic_technique: "T1003.003"
    technique_name: "OS Credential Dumping - NTDS"
    atomic_test_number: 1
    expected_rules: ["TS-062"]
    sysmon_required: false
    requires: "domain_controller"
    timeout_seconds: 180
    fallback_command: "vssadmin list shadows 2>$null; cmd /c 'ntdsutil \"ac i ntds\" \"ifm\" \"create full %TEMP%\\ntds_art_test\" q q' 2>$null; Remove-Item $env:TEMP\\ntds_art_test -Recurse -Force -ErrorAction SilentlyContinue"
    notes: "Accesses ntds.dit. Generates event 4663. Requires DC. Fallback attempts ntdsutil (will fail gracefully on non-DC)."

  # -- Phase 15 M3/M4: Gap-Coverage Techniques --

  - atomic_technique: "T1087.001"
    technique_name: "Account Discovery - Local Account"
    atomic_test_number: 1
    expected_rules: ["TS-130"]
    sysmon_required: false
    timeout_seconds: 120
    fallback_command: "cmd /c 'net user' 2>$null; cmd /c 'net localgroup administrators' 2>$null; cmd /c 'whoami /all' 2>$null; cmd /c 'net localgroup' 2>$null"
    notes: "Runs net user/localgroup/whoami. Generates 4688 events (threshold 3). Each cmd /c spawns a process. Removed 'net group' (DC-only)."

  - atomic_technique: "T1018"
    technique_name: "Remote System Discovery"
    atomic_test_number: 1
    expected_rules: ["TS-131"]
    sysmon_required: false
    timeout_seconds: 120
    fallback_command: "cmd /c 'ipconfig /all' 2>$null; cmd /c 'netstat -an' 2>$null; cmd /c 'arp -a' 2>$null; cmd /c 'route print' 2>$null; cmd /c 'nslookup localhost' 2>$null"
    notes: "Runs ipconfig/netstat/arp/route/nslookup. Each cmd /c generates a separate 4688 event (threshold 4). Fallback runs discovery commands directly."

  - atomic_technique: "T1105"
    technique_name: "Ingress Tool Transfer"
    atomic_test_number: 1
    expected_rules: ["TS-132"]
    sysmon_required: false
    timeout_seconds: 120
    fallback_command: "try { cmd /c \"bitsadmin /transfer artjob /download /priority foreground https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/LICENSE.txt %TEMP%\\art-bitsadmin-test.txt\" 2>&1 | Out-Null } catch {}; Start-Sleep -Seconds 2; try { cmd /c \"certutil -urlcache -split -f https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/LICENSE.txt %TEMP%\\art-certutil-test.txt\" 2>&1 | Out-Null } catch {}; Remove-Item $env:TEMP\\art-*-test.txt -ErrorAction SilentlyContinue"
    notes: "Downloads file via bitsadmin and certutil. Generates 4688 events. Each cmd /c wrapped in try/catch to prevent error propagation."

  - atomic_technique: "T1055"
    technique_name: "Process Injection"
    atomic_test_number: 1
    expected_rules: ["TS-133"]
    sysmon_required: true
    timeout_seconds: 120
    notes: "CreateRemoteThread injection. Requires Sysmon Event 8."

  - atomic_technique: "T1027"
    technique_name: "Obfuscated Files or Information"
    atomic_test_number: 1
    expected_rules: ["TS-134"]
    sysmon_required: false
    timeout_seconds: 120
    fallback_command: "Start-Process powershell.exe -ArgumentList '-enc','dwBoAG8AYQBtAGkA' -Wait -ErrorAction SilentlyContinue; Start-Process cmd.exe -ArgumentList '/c','powershell -e dwBoAG8AYQBtAGkA' -Wait -ErrorAction SilentlyContinue"
    notes: "Encoded/obfuscated PowerShell commands. Generates 4688 and 4104. Fallback runs base64-encoded 'whoami' via Start-Process to avoid flag conflicts."

  - atomic_technique: "T1565.001"
    technique_name: "Data Manipulation - Stored Data Manipulation"
    atomic_test_number: 1
    expected_rules: ["TS-110"]
    sysmon_required: false
    requires: "fim_module"
    timeout_seconds: 180
    fallback_command: "$hostsFile = 'C:\\Windows\\System32\\drivers\\etc\\hosts'; $backup = Get-Content $hostsFile -Raw; Add-Content $hostsFile '# TinySocs ART test entry'; Start-Sleep -Seconds 5; Set-Content $hostsFile $backup"
    notes: "Modifies hosts file or SAM hive. Detected by FIM (custom TinySocs-FIM channel). Fallback appends to hosts file then restores."

  - atomic_technique: "T1047"
    technique_name: "Windows Management Instrumentation"
    atomic_test_number: 1
    expected_rules: ["TS-136", "TS-061", "TS-132", "TS-134"]
    sysmon_required: false
    timeout_seconds: 120
    fallback_command: "Invoke-WmiMethod -Class Win32_Process -Name Create -ArgumentList 'cmd /c whoami > %TEMP%\\art-wmi-test.txt' -ErrorAction SilentlyContinue; Start-Sleep -Seconds 5; Remove-Item $env:TEMP\\art-wmi-test.txt -ErrorAction SilentlyContinue"
    notes: "WMI-spawned process. Parent is wmiprvse.exe. Generates 4688 events (TS-136 preferred, TS-061/TS-132/TS-134 fallback). Fallback uses PowerShell WMI cmdlet (wmic deprecated)."
