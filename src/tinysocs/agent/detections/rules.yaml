# TinySocs Rule Pack v1 — hardened (dual-field & provider/channel guards)
# Notes:
# - Use (event.code OR winlog.event_id) to match different shippers.
# - Guard on provider/channel where it helps (Sysmon, PowerShell).
# - For process names, check name/executable/NewProcessName.
# - For cmdline, check both process.command_line and winlog.event_data.CommandLine.
# - group_by fields are normalized to keyword by the API.
# - time_field is explicit for all rules.

- id: auth_failed_burst
  description: Multiple failed Windows logons (4625) from same IP/user in 2 hours
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4625 OR winlog.event_id:4625)
    AND NOT winlog.event_data.IpAddress:(127.0.0.1 OR "::1")
    AND NOT winlog.event_data.TargetUserName:(NoSuchUser)
  group_by: ["winlog.event_data.IpAddress","winlog.event_data.TargetUserName"]
  threshold: 5
  severity: medium
  category: auth
  tuning_envvars:
    - AUTH_FAIL_THRESHOLD

# NEW: aggregation-first rule used by the harness
- id: script_block_volume
  description: PowerShell Script Block volume per host (4104)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4104 OR winlog.event_id:4104)
    AND (winlog.channel:"Microsoft-Windows-PowerShell/Operational" OR channel:"Microsoft-Windows-PowerShell/Operational")
  group_by: ["host.name"]
  threshold: 10
  severity: medium
  category: powershell

- id: sysmon_proc_creation
  description: Sysmon process creation events (ID 1)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:1 OR winlog.event_id:1)
    AND (provider.name:"Microsoft-Windows-Sysmon" OR winlog.provider_name:"Microsoft-Windows-Sysmon")
  group_by: ["host.name","process.name"]
  threshold: 10
  severity: low
  category: endpoint

- id: ps_script_block
  description: PowerShell ScriptBlock logging (ID 4104)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4104 OR winlog.event_id:4104)
    AND (winlog.channel:"Microsoft-Windows-PowerShell/Operational" OR channel:"Microsoft-Windows-PowerShell/Operational")
  # 4104 often lacks user.name; grouping on user.name can zero out buckets → group by host only.
  group_by: ["host.name"]
  threshold: 3
  severity: medium
  category: powershell

- id: proc_creation_powershell_suspicious
  description: PowerShell with suspicious flags (4688 / Sysmon ID 1)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(4688 OR 1) OR winlog.event_id:(4688 OR 1))
    AND (
      process.name:(powershell.exe pwsh.exe)
      OR process.executable:(*\\powershell.exe *\\pwsh.exe)
      OR winlog.event_data.NewProcessName:(*\\powershell.exe *\\pwsh.exe)
    )
    AND (
      process.command_line:(*-EncodedCommand* OR *-enc* OR *-NoProfile* OR *-nop* OR *-WindowStyle* OR *-w* OR *-Command*)
      OR winlog.event_data.CommandLine:(*-EncodedCommand* OR *-enc* OR *-NoProfile* OR *-nop* OR *-WindowStyle* OR *-w* OR *-Command*)
    )
  group_by: ["host.name","user.name"]
  threshold: 1
  severity: high
  category: powershell

- id: proc_creation_lolbins
  description: Possible LOLBIN execution (4688 / Sysmon 1) — rundll32, regsvr32, mshta, wmic, certutil
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(4688 OR 1) OR winlog.event_id:(4688 OR 1))
    AND (
      process.name:(rundll32.exe regsvr32.exe mshta.exe wmic.exe certutil.exe)
      OR process.executable:(*\\rundll32.exe *\\regsvr32.exe *\\mshta.exe *\\wmic.exe *\\certutil.exe)
      OR winlog.event_data.NewProcessName:(*\\rundll32.exe *\\regsvr32.exe *\\mshta.exe *\\wmic.exe *\\certutil.exe)
    )
  group_by: ["host.name","process.name"]
  threshold: 2
  severity: high
  category: endpoint

- id: suspicious_powershell
  description: Suspicious PowerShell flags (NoProfile, EncodedCommand, Hidden, Bypass)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4688 OR winlog.event_id:4688)
    AND (
      process.name:(powershell.exe pwsh.exe)
      OR process.executable:(*\\powershell.exe *\\pwsh.exe)
      OR winlog.event_data.NewProcessName:(*\\powershell.exe *\\pwsh.exe)
    )
    AND (
      process.command_line:(*-nop* OR *-noprofile* OR *-enc* OR *-encodedcommand* OR *-w* OR *-windowstyle* OR *-executionpolicy* OR *bypass*)
      OR winlog.event_data.CommandLine:(*-nop* OR *-noprofile* OR *-enc* OR *-encodedcommand* OR *-w* OR *-windowstyle* OR *-executionpolicy* OR *bypass*)
    )
  group_by: ["host.name","user.name"]
  threshold: 1
  severity: high
  category: powershell

- id: lolbin_execs
  description: Multiple LOLBIN executions in short window
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4688 OR winlog.event_id:4688)
    AND (
      process.name:("rundll32.exe" "regsvr32.exe" "mshta.exe" "certutil.exe" "powershell.exe" "wmic.exe" "pwsh.exe")
      OR process.executable:(*\\rundll32.exe *\\regsvr32.exe *\\mshta.exe *\\certutil.exe *\\powershell.exe *\\wmic.exe *\\pwsh.exe)
      OR winlog.event_data.NewProcessName:(*\\rundll32.exe *\\regsvr32.exe *\\mshta.exe *\\certutil.exe *\\powershell.exe *\\wmic.exe *\\pwsh.exe)
    )
  group_by: ["host.name","user.name"]
  threshold: 3
  severity: medium
  category: endpoint

# New additions (unaltered logic but kept robust where relevant)

- id: local_admin_create
  description: Local admin account created (4720)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: '(event.code:4720 OR winlog.event_id:4720)'
  group_by: ["host.name","user.name"]
  threshold: 1
  severity: high
  category: identity

- id: scheduled_task_creation
  description: Scheduled task created (4698)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: '(event.code:4698 OR winlog.event_id:4698)'
  group_by: ["host.name","user.name"]
  threshold: 1
  severity: medium
  category: persistence

- id: wmi_process_creation
  description: WMI-spawned process (4688 parent is WmiPrvSE or process is wmic.exe)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4688 OR winlog.event_id:4688) AND (
      process.parent.name:"wmiprvse.exe"
      OR winlog.event_data.ParentProcessName:(*\\wmiprvse.exe)
      OR process.name:"wmic.exe"
      OR winlog.event_data.NewProcessName:(*\\wmic.exe)
    )
  group_by: ["host.name","process.name"]
  threshold: 1
  severity: medium
  category: lateral

- id: suspicious_svchost
  description: svchost.exe spawning scripting/LOL processes
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4688 OR winlog.event_id:4688)
    AND (
      process.parent.name:"svchost.exe" OR winlog.event_data.ParentProcessName:(*\\svchost.exe)
    )
    AND (
      process.name:(powershell.exe cmd.exe wscript.exe cscript.exe mshta.exe rundll32.exe regsvr32.exe)
      OR winlog.event_data.NewProcessName:(*\\powershell.exe *\\cmd.exe *\\wscript.exe *\\cscript.exe *\\mshta.exe *\\rundll32.exe *\\regsvr32.exe)
    )
  group_by: ["host.name","process.name"]
  threshold: 1
  severity: high
  category: endpoint

- id: powershell_web_dl
  description: PowerShell web download usage (Invoke-WebRequest/DownloadString)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(4104 OR 4688) OR winlog.event_id:(4104 OR 4688)) AND (
      message:(*Invoke-WebRequest* OR *iwr* OR *DownloadString*)
      OR process.command_line:(*Invoke-WebRequest* OR *iwr* OR *DownloadString*)
      OR winlog.event_data.CommandLine:(*Invoke-WebRequest* OR *iwr* OR *DownloadString*)
    )
  group_by: ["host.name","user.name"]
  threshold: 1
  severity: medium
  category: powershell

- id: ps_transcription_off
  description: PowerShell transcription disabled
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4104 OR winlog.event_id:4104)
    AND message:"Transcription disabled"
  group_by: ["host.name"]
  threshold: 1
  severity: medium
  category: powershell

- id: scriptblock_base64
  description: Large base64 chunk observed in ScriptBlock
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4104 OR winlog.event_id:4104)
    AND message:/[A-Za-z0-9+/]{200,}={0,2}/
  group_by: ["host.name"]
  threshold: 1
  severity: medium
  category: powershell

- id: vpn_geo_impossible
  description: Logins from far-apart locations in short time (post-process correlation may apply)
  index: "vpn-*"
  time_field: "@timestamp"
  kql: 'event:login AND outcome:success'
  group_by: ["user.name"]
  threshold: 2
  severity: medium
  category: network

- id: firewall_deny_burst
  description: Burst of firewall denies to same destination
  index: "firewall-*"
  time_field: "@timestamp"
  kql: 'action:blocked'
  group_by: ["destination.ip"]
  threshold: 5
  severity: low
  category: network

- id: m365_mfa_fatigue
  description: Multiple MFA denials for the same user (Microsoft 365)
  index: "o365-*"
  time_field: "@timestamp"
  kql: 'Operation:"UserLoginFailed" AND ResultStatus:"MFA Denied"'
  group_by: ["UserId"]
  threshold: 3
  severity: medium
  category: cloud

- id: m365_mail_forward_rule
  description: Mailbox forwarding rule created
  index: "o365-*"
  time_field: "@timestamp"
  kql: 'Operation:"New-InboxRule" AND Parameters:"ForwardTo"'
  group_by: ["UserId"]
  threshold: 1
  severity: medium
  category: cloud


