# ===== Phase 13 — Detection Coverage Expansion =====
# Credential Access

- id: lsass_access
  description: Process accessing LSASS memory (Sysmon Event 10, TargetImage lsass.exe)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:10 OR winlog.event_id:10)
    AND (provider.name:"Microsoft-Windows-Sysmon" OR winlog.provider_name:"Microsoft-Windows-Sysmon")
    AND (winlog.event_data.TargetImage:(*\\lsass.exe))
  group_by: ["host.name","winlog.event_data.SourceImage"]
  threshold: 1
  severity: critical
  category: credential_access
  mitre:
    technique_id: "T1003.001"
    technique_name: "OS Credential Dumping: LSASS Memory"
    tactic: "credential-access"

- id: credential_dumping_tools
  description: Known credential dumping tool names in process creation (mimikatz, procdump, secretsdump)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(4688 OR 1) OR winlog.event_id:(4688 OR 1))
    AND (
      process.name:(mimikatz.exe procdump.exe procdump64.exe secretsdump.exe lazagne.exe)
      OR process.executable:(*\\mimikatz* *\\procdump* *\\secretsdump* *\\lazagne*)
      OR winlog.event_data.NewProcessName:(*\\mimikatz* *\\procdump* *\\secretsdump* *\\lazagne*)
      OR process.command_line:(*mimikatz* OR *sekurlsa* OR *lsadump* OR *kerberos::*)
      OR winlog.event_data.CommandLine:(*mimikatz* OR *sekurlsa* OR *lsadump* OR *kerberos::*)
    )
  group_by: ["host.name","process.name"]
  threshold: 1
  severity: critical
  category: credential_access
  mitre:
    technique_id: "T1003.001"
    technique_name: "OS Credential Dumping: LSASS Memory"
    tactic: "credential-access"

- id: ntds_dit_access
  description: Access to ntds.dit or SYSTEM hive (credential theft from domain controller)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(4663 OR 11) OR winlog.event_id:(4663 OR 11))
    AND (
      winlog.event_data.ObjectName:(*ntds.dit* OR *SYSTEM*)
      OR winlog.event_data.TargetFilename:(*ntds.dit* OR *\\config\\SYSTEM*)
      OR message:(*ntds.dit* OR *vssadmin* OR *ntdsutil*)
    )
  group_by: ["host.name"]
  threshold: 1
  severity: critical
  category: credential_access
  mitre:
    technique_id: "T1003.003"
    technique_name: "OS Credential Dumping: NTDS"
    tactic: "credential-access"

# Lateral Movement

- id: psexec_usage
  description: PsExec service installation or named pipe creation
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (
      ((event.code:7045 OR winlog.event_id:7045) AND winlog.event_data.ServiceName:(*PSEXESVC* OR *psexec*))
      OR
      ((event.code:(17 OR 18) OR winlog.event_id:(17 OR 18))
        AND (provider.name:"Microsoft-Windows-Sysmon" OR winlog.provider_name:"Microsoft-Windows-Sysmon")
        AND winlog.event_data.PipeName:(*PSEXESVC* OR *psexec*))
    )
  group_by: ["host.name"]
  threshold: 1
  severity: high
  category: lateral
  mitre:
    technique_id: "T1021.002"
    technique_name: "Remote Services: SMB/Windows Admin Shares"
    tactic: "lateral-movement"

- id: rdp_brute_force
  description: Multiple RDP logon failures (4625 LogonType 10)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4625 OR winlog.event_id:4625)
    AND winlog.event_data.LogonType:10
  group_by: ["winlog.event_data.IpAddress"]
  threshold: 5
  severity: high
  category: lateral
  mitre:
    technique_id: "T1110.001"
    technique_name: "Brute Force: Password Guessing"
    tactic: "credential-access"

- id: remote_service_install
  description: Service installed remotely (Event 7045 — suspicious service paths)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:7045 OR winlog.event_id:7045)
    AND NOT winlog.event_data.ImagePath:(*\\Windows\\* OR *\\Microsoft\\*)
  group_by: ["host.name","winlog.event_data.ServiceName"]
  threshold: 1
  severity: high
  category: lateral
  mitre:
    technique_id: "T1021.002"
    technique_name: "Remote Services: SMB/Windows Admin Shares"
    tactic: "lateral-movement"

