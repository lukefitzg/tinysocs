agent:
  name: TinySocsAgent
  node_id: default-node
  log_level: info
  log_file: C:\ProgramData\TinySocs\Collector\logs\agent.log
  debug_fake_input: false        # set to true in labs to generate synthetic test events

inputs:
  - type: eventlog
    name: win-events
    channels:
      - name: Security
        level: information          # critical/error/warning/information/verbose
        start_from: now             # now | bookmark | beginning
      - name: System
        level: information          # must include Information-level events (e.g. 7045 service installed)
        start_from: now
      - name: Application
        level: information
        start_from: now
      - name: Microsoft-Windows-PowerShell/Operational
        level: information
        start_from: now
      - name: Microsoft-Windows-Sysmon/Operational
        level: information
        start_from: now
      - name: Microsoft-Windows-Windows Defender/Operational
        level: information
        start_from: now
    bookmarks:
      path: C:\ProgramData\TinySocs\Collector\agent\bookmarks
      persist_interval_seconds: 10

  # File Integrity Monitoring. Watches critical system files (hosts, SAM/SYSTEM/
  # SECURITY hives, GroupPolicy) and a seeded ransomware canary directory. Powers
  # TS-110 (critical-file tampering), TS-113 (ransomware mass-modification) and
  # TS-114 (sensitive-file deletion). Uses the built-in default paths + canary;
  # override `fim:` here to customise. Enabled by default — this is the
  # ransomware early-warning that a business with no security team can't build.
  - type: fim
    name: file-integrity

queue:
  path: C:\ProgramData\TinySocs\Collector\agent\queue
  segment_max_bytes: 10485760        # 10 MB
  max_segments: 100                  # ~1 GB cap
  flush_interval_ms: 200
  sync_on_flush: true
  retention_policy:
    min_successful_ship_count: 1     # how many ship passes before deletion

output:
  type: opensearch
  url: https://localhost:9201
  ssl_verify: false
  index_pattern: tinysocs-winlog-{yyyy.MM.dd}
  pipeline: ""                       # optional ingest pipeline name
  bulk:
    batch_size_events: 500
    batch_size_bytes: 5242880        # 5 MB
    flush_interval_ms: 1000
  retry:
    max_retries: 5
    initial_backoff_ms: 1000
    max_backoff_ms: 60000

privacy:
  drop_fields:
    - "winlog.event_data.CommandLine"
    - "winlog.event_data.ProcessCommandLine"
  hash_fields:
    - "winlog.event_data.TargetUserName"
    - "winlog.event_data.TargetDomainName"
  truncate_fields:
    - field: "message"
      max_length: 4096

siem_credentials:
  source: credman
  target: TinySocs/OpenSearch/tinysocs

detection:
  enabled: true
  rules_file: C:\ProgramData\TinySocs\Collector\rules\rules.yml
  reload_interval_seconds: 60
  notification:
    # Webhook: Slack-compatible JSON POST (fires on every alert)
    # Payload: { "text": "[severity] rule_name — description (count=N)" }
    # Leave empty to disable. No retry on failure.
    webhook_url: ""

    # Email: SMTP alert notifications (rate-limited: max 1 per rule per 5 minutes)
    # Subject: [TinySocs] [SEVERITY] Rule Name — description
    # Uses STARTTLS on port 587 by default. Leave smtp_host empty to disable.
    email:
      smtp_host: ""
      smtp_port: 587
      from: ""
      to: ""

    # Retry queue: disk-backed retry for failed webhook/email notifications.
    # Failed notifications are written to notification_queue.jsonl and retried
    # with exponential backoff. Entries older than max_age_seconds are discarded.
    retry:
      max_attempts: 3
      backoff_seconds: 30
      max_age_seconds: 3600
