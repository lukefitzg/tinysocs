[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "tinysocs"
version = "0.9.0"
description = "TinySocs — a lightweight, privacy-first, federated SIEM/analyst assistant."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "TinySocs", email = "support@tinysocs.local" }]
license = { text = "MIT" }
keywords = ["siem", "security", "opensearch", "detections", "llm"]
dependencies = [
  "httpx>=0.24",
  "requests>=2.31",
  "PyYAML>=6.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "opensearch-py>=2.5",
  "anthropic>=0.39",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "mypy>=1.10",
  "ruff>=0.6",
  "types-requests",
  "types-PyYAML",
]

[project.scripts]
tinysocs-node = "tinysocs.api.node:cli"
tinysocs-master = "tinysocs.orchestrator.master:cli"
tinysocs-quickstart = "tinysocs.launcher.quickstart:cli"
tinysocs-daily-summary = "tinysocs.reporting.daily_summary:main"


# Tell Hatch/pip that the package is under src/
[tool.hatch.build.targets.wheel]
packages = ["src/tinysocs"]

[tool.hatch.build.targets.sdist]
include = [
  "src/tinysocs",
  "scripts",
  "support",
  "integrations",
  "LICENSE",
  "README.md"
]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E","F","W","I","N","UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = false
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
