- id: TS-001
  name: brute_force_logon
  description: Multiple failed logon attempts (4625) from the same user
  severity: high
  enabled: true
  runs_on: agent
  pack: base
  mitre:
    technique_id: T1110.001
    technique_name: 'Brute Force: Password Guessing'
    tactic: credential-access
  docs: tinydocs/TS-001.md
  detection:
    type: threshold_by_key
    event_id: 4625
    channel: Security
    group_by: winlog.event_data.TargetUserName
    threshold: 15
    window_minutes: 5
  allowlist_scopes:
  - user
  - user_pattern
  - host
  baseline:
    enabled: false
    learning_days: 7
    keyed_by:
    - host
    action_below_baseline: suppress
  actions:
  - write_alert_doc
  - append_alert_log
  tuning:
    threshold:
      envvar: null
      min: 3
      max: 75
      default: 15
