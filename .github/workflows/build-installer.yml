name: build-installer
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build C# agent
        shell: pwsh
        run: |
          .\scripts\Build-Agent.ps1

      - name: Upload C# agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinysocs-agent
          path: src/TinySocs.Agent/bin/Release/net8.0/win-x64/publish/TinySocs.Agent.exe
          if-no-files-found: error

      - name: Build Python service EXEs (PyInstaller)
        shell: pwsh
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm TinySocsNode.spec
          pyinstaller --noconfirm TinySocsMaster.spec
          pyinstaller --noconfirm TinySocsAnchors.spec
          foreach ($exe in @("dist/TinySocsNode.exe", "dist/TinySocsMaster.exe", "dist/TinySocsAnchors.exe")) {
            if (-not (Test-Path $exe)) { throw "PyInstaller output missing: $exe" }
          }
          Write-Host "All service EXEs built."

      - name: Cache OpenSearch vendor payload
        id: cache-opensearch
        uses: actions/cache@v4
        with:
          path: vendor/opensearch-3.3.2-windows-x64
          # -v2 suffix: old cache entries under the un-suffixed key may hold a
          # mismatched 2.18.0 payload from the pre-fix workflow; never reuse them.
          key: opensearch-3.3.2-windows-x64-v2

      - name: Download OpenSearch vendor payload
        if: steps.cache-opensearch.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://artifacts.opensearch.org/releases/bundle/opensearch/3.3.2/opensearch-3.3.2-windows-x64.zip"
          # Official published SHA512, from ${url}.sha512
          $expectedHash = "e8a1d81bec03fc37ffffcf786696061a0f2a8aa62780a964a688b9dd0ec09bdbbf7b67419b28cab9384ca54e3d247e66d84468d933cc8909cca918cf99039921"
          $zip = "opensearch.zip"
          Write-Host "Downloading OpenSearch 3.3.2..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $actualHash = (Get-FileHash -Path $zip -Algorithm SHA512).Hash.ToLower()
          Write-Host "Downloaded SHA512: $actualHash"
          if ($actualHash -ne $expectedHash) {
            throw "SHA512 mismatch for OpenSearch download! Expected=$expectedHash Got=$actualHash"
          }
          New-Item -ItemType Directory -Path "vendor/opensearch-3.3.2-windows-x64" -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath "vendor/opensearch-3.3.2-windows-x64" -Force
          Remove-Item $zip

      - name: Verify vendor payload layout
        shell: pwsh
        run: |
          $bat = "vendor/opensearch-3.3.2-windows-x64/opensearch-3.3.2/bin/opensearch.bat"
          if (-not (Test-Path $bat)) {
            Get-ChildItem "vendor/opensearch-3.3.2-windows-x64" -Depth 1 | Format-Table -AutoSize | Out-String | Write-Host
            throw "Vendor payload layout wrong: $bat not found (Quickstart.iss will refuse to compile)."
          }
          Write-Host "Vendor payload OK: $bat"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc packaging\iss\Quickstart.iss

      - name: Generate checksums
        shell: pwsh
        run: |
          $exe = "packaging/iss/TinySocs-Setup.exe"
          if (Test-Path $exe) {
            $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
            "$hash  TinySocs-Setup.exe" | Out-File -FilePath "packaging/iss/SHA256SUMS.txt" -Encoding ascii
            Write-Host "SHA256: $hash"
          } else {
            throw "Installer not found at $exe"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinysocs-setup
          path: |
            packaging/iss/TinySocs-Setup.exe
            packaging/iss/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tinysocs-setup
          path: release-assets

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # Extract section for this version from CHANGELOG.md
          BODY=$(awk "/^## \[${TAG}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release ${TAG}"
          fi
          # Write to file for gh-release body
          echo "$BODY" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TinySocs ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/TinySocs-Setup.exe
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
