###################### Winlogbeat Configuration (OpenSearch) ###################

winlogbeat.event_logs:
  - name: Application
    ignore_older: 72h
  - name: System
  - name: Security
  - name: Microsoft-Windows-Sysmon/Operational
  - name: Windows PowerShell
    event_id: 400, 403, 600, 800
  - name: Microsoft-Windows-PowerShell/Operational
    event_id: 4103, 4104, 4105, 4106
  - name: ForwardedEvents
    tags: [forwarded]

setup.template.settings:
  index.number_of_shards: 1

# Required when you customize the index name:
setup.template.name: "winlogbeat"
setup.template.pattern: "winlogbeat-*"

# ILM is an Elastic feature; disable under OpenSearch to avoid ILM errors.
setup.ilm.enabled: false

processors:
  - add_host_metadata: { when.not.contains.tags: forwarded }
  - add_cloud_metadata: ~

# ---------------------------- OpenSearch Output -------------------------------
# (Beats still uses the "elasticsearch" output for OpenSearch clusters)
output.elasticsearch:
  hosts: ["localhost:9201"]
  # If security is enabled in OpenSearch, uncomment:
  #username: "admin"
  #password: "ChangeMe123!"

  # Do NOT use the Elastic pipeline on OpenSearch
  #pipeline: "winlogbeat-%{[agent.version]}-routing"

# Use a plain index pattern (works well in OpenSearch)
index: "winlogbeat-%{[agent.version]}-%{+yyyy.MM.dd}"

#logging.level: info
