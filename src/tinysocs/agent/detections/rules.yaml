# ===== Phase 15 M3 — Gap-Coverage Rules =====

- id: account_discovery
  description: Account/group enumeration commands (net user, net localgroup, whoami /all)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(4688 OR 1) OR winlog.event_id:(4688 OR 1))
    AND (
      process.name:(net.exe net1.exe whoami.exe)
      OR process.executable:(*\\net.exe *\\net1.exe *\\whoami.exe)
      OR winlog.event_data.NewProcessName:(*\\net.exe *\\net1.exe *\\whoami.exe)
    )
    AND (
      process.command_line:(*user* OR *localgroup* OR */all*)
      OR winlog.event_data.CommandLine:(*user* OR *localgroup* OR */all*)
    )
  group_by: ["host.name","user.name"]
  threshold: 3
  severity: medium
  category: discovery
  mitre:
    technique_id: "T1087.001"
    technique_name: "Account Discovery: Local Account"
    tactic: "discovery"

