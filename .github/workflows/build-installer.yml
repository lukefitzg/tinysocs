name: build-installer
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build C# agent
        shell: pwsh
        run: |
          .\scripts\Build-Agent.ps1

      - name: Upload C# agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinysocs-agent
          path: src/TinySocs.Agent/bin/Release/net8.0/win-x64/publish/TinySocs.Agent.exe
          if-no-files-found: error

      - name: Cache OpenSearch vendor payload
        id: cache-opensearch
        uses: actions/cache@v4
        with:
          path: vendor/opensearch-3.3.2-windows-x64
          key: opensearch-3.3.2-windows-x64

      - name: Download OpenSearch vendor payload
        if: steps.cache-opensearch.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://artifacts.opensearch.org/releases/bundle/opensearch/2.18.0/opensearch-2.18.0-windows-x64.zip"
          $zip = "opensearch.zip"
          Write-Host "Downloading OpenSearch..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          New-Item -ItemType Directory -Path "vendor/opensearch-3.3.2-windows-x64" -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath "vendor/opensearch-3.3.2-windows-x64" -Force
          Remove-Item $zip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc packaging\iss\Quickstart.iss

      - name: Generate checksums
        shell: pwsh
        run: |
          $exe = "packaging/iss/TinySocs-Setup.exe"
          if (Test-Path $exe) {
            $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
            "$hash  TinySocs-Setup.exe" | Out-File -FilePath "packaging/iss/SHA256SUMS.txt" -Encoding ascii
            Write-Host "SHA256: $hash"
          } else {
            throw "Installer not found at $exe"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinysocs-setup
          path: |
            packaging/iss/TinySocs-Setup.exe
            packaging/iss/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tinysocs-setup
          path: release-assets

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          # Extract section for this version from CHANGELOG.md
          BODY=$(awk "/^## \[${TAG}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release ${TAG}"
          fi
          # Write to file for gh-release body
          echo "$BODY" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TinySocs v${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release-assets/TinySocs-Setup.exe
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
