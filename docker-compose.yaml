services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: ts-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["9200:9200"]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/"]
      interval: 10s
      timeout: 5s
      retries: 60

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.3
    container_name: ts-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on:
      elasticsearch:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: ts-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      # ↑↑ bumped heap to 2g to avoid parent circuit breaker trips
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
      - plugins.security.disabled=false
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.transport.enforce_hostname_verification=false
    ports:
      - "9201:9200"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -u \"admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD}\" https://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 5s
      retries: 60

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: ts-opensearch-dashboards
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    ports:
      - "5602:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  logstash:
    build:
      context: ./integrations/winlogbeat/logstash
      dockerfile: Dockerfile
    image: tinysocs-logstash
    container_name: ts-logstash
    restart: unless-stopped
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ports:
      - "5044:5044"
    volumes:
      - ./integrations/winlogbeat/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./integrations/winlogbeat/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9600/_node/pipelines | grep -q '\"main\"' && bash -lc 'exec 3<>/dev/tcp/127.0.0.1/5044'"]
      interval: 10s
      timeout: 5s
      retries: 60
    depends_on:
      opensearch:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  opensearch-data: