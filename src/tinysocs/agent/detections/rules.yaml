# TinySocs Rule Pack v1 — hardened (dual-field & provider/channel guards)
# Notes:
# - Use (event.code OR winlog.event_id) to match different shippers.
# - Guard on provider/channel where it helps (Sysmon, PowerShell).
# - For process names, check name/executable/NewProcessName.
# - For cmdline, check both process.command_line and winlog.event_data.CommandLine.
# - group_by fields are normalized to keyword by the API.
# - time_field is explicit for all rules.

- id: auth_failed_burst
  description: Multiple failed Windows logons (4625) from same IP/user in 2 hours
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4625 OR winlog.event_id:4625)
    AND NOT winlog.event_data.IpAddress:(127.0.0.1 OR "::1")
    AND NOT winlog.event_data.TargetUserName:(NoSuchUser)
  group_by: ["winlog.event_data.IpAddress","winlog.event_data.TargetUserName"]
  threshold: 5
  severity: medium
  category: auth
  tuning_envvars:
    - AUTH_FAIL_THRESHOLD

# NEW: aggregation-first rule used by the harness
- id: script_block_volume
  description: PowerShell Script Block volume per host (4104)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4104 OR winlog.event_id:4104)
    AND (winlog.channel:"Microsoft-Windows-PowerShell/Operational" OR channel:"Microsoft-Windows-PowerShell/Operational")
  group_by: ["host.name"]
  threshold: 10
  severity: medium
  category: powershell

- id: sysmon_proc_creation
  description: Sysmon process creation events (ID 1)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:1 OR winlog.event_id:1)
    AND (provider.name:"Microsoft-Windows-Sysmon" OR winlog.provider_name:"Microsoft-Windows-Sysmon")
  group_by: ["host.name","process.name"]
  threshold: 10
  severity: low
  category: endpoint

- id: ps_script_block
  description: PowerShell ScriptBlock logging (ID 4104)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4104 OR winlog.event_id:4104)
    AND (winlog.channel:"Microsoft-Windows-PowerShell/Operational" OR channel:"Microsoft-Windows-PowerShell/Operational")
  # 4104 often lacks user.name; grouping on user.name can zero out buckets → group by host only.
  group_by: ["host.name"]
  threshold: 3
  severity: medium
  category: powershell

- id: proc_creation_powershell_suspicious
  description: PowerShell with suspicious flags (4688 / Sysmon ID 1)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(4688 OR 1) OR winlog.event_id:(4688 OR 1))
    AND (
      process.name:(powershell.exe pwsh.exe)
      OR process.executable:(*\\powershell.exe *\\pwsh.exe)
      OR winlog.event_data.NewProcessName:(*\\powershell.exe *\\pwsh.exe)
    )
    AND (
      process.command_line:(*-EncodedCommand* OR *-enc* OR *-NoProfile* OR *-nop* OR *-WindowStyle* OR *-w* OR *-Command*)
      OR winlog.event_data.CommandLine:(*-EncodedCommand* OR *-enc* OR *-NoProfile* OR *-nop* OR *-WindowStyle* OR *-w* OR *-Command*)
    )
  group_by: ["host.name","user.name"]
  threshold: 1
  severity: high
  category: powershell

- id: proc_creation_lolbins
  description: Possible LOLBIN execution (4688 / Sysmon 1) — rundll32, regsvr32, mshta, wmic, certutil
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(4688 OR 1) OR winlog.event_id:(4688 OR 1))
    AND (
      process.name:(rundll32.exe regsvr32.exe mshta.exe wmic.exe certutil.exe)
      OR process.executable:(*\\rundll32.exe *\\regsvr32.exe *\\mshta.exe *\\wmic.exe *\\certutil.exe)
      OR winlog.event_data.NewProcessName:(*\\rundll32.exe *\\regsvr32.exe *\\mshta.exe *\\wmic.exe *\\certutil.exe)
    )
  group_by: ["host.name","process.name"]
  threshold: 2
  severity: high
  category: endpoint

- id: suspicious_powershell
  description: Suspicious PowerShell flags (NoProfile, EncodedCommand, Hidden, Bypass)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4688 OR winlog.event_id:4688)
    AND (
      process.name:(powershell.exe pwsh.exe)
      OR process.executable:(*\\powershell.exe *\\pwsh.exe)
      OR winlog.event_data.NewProcessName:(*\\powershell.exe *\\pwsh.exe)
    )
    AND (
      process.command_line:(*-nop* OR *-noprofile* OR *-enc* OR *-encodedcommand* OR *-w* OR *-windowstyle* OR *-executionpolicy* OR *bypass*)
      OR winlog.event_data.CommandLine:(*-nop* OR *-noprofile* OR *-enc* OR *-encodedcommand* OR *-w* OR *-windowstyle* OR *-executionpolicy* OR *bypass*)
    )
  group_by: ["host.name","user.name"]
  threshold: 1
  severity: high
  category: powershell

- id: lolbin_execs
  description: Multiple LOLBIN executions in short window
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4688 OR winlog.event_id:4688)
    AND (
      process.name:("rundll32.exe" "regsvr32.exe" "mshta.exe" "certutil.exe" "powershell.exe" "wmic.exe" "pwsh.exe")
      OR process.executable:(*\\rundll32.exe *\\regsvr32.exe *\\mshta.exe *\\certutil.exe *\\powershell.exe *\\wmic.exe *\\pwsh.exe)
      OR winlog.event_data.NewProcessName:(*\\rundll32.exe *\\regsvr32.exe *\\mshta.exe *\\certutil.exe *\\powershell.exe *\\wmic.exe *\\pwsh.exe)
    )
  group_by: ["host.name","user.name"]
  threshold: 3
  severity: medium
  category: endpoint

# New additions (unaltered logic but kept robust where relevant)

- id: local_admin_create
  description: Local admin account created (4720)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: '(event.code:4720 OR winlog.event_id:4720)'
  group_by: ["host.name","user.name"]
  threshold: 1
  severity: high
  category: identity

- id: scheduled_task_creation
  description: Scheduled task created (4698)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: '(event.code:4698 OR winlog.event_id:4698)'
  group_by: ["host.name","user.name"]
  threshold: 1
  severity: medium
  category: persistence

- id: wmi_process_creation
  description: WMI-spawned process (4688 parent is WmiPrvSE or process is wmic.exe)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4688 OR winlog.event_id:4688) AND (
      process.parent.name:"wmiprvse.exe"
      OR winlog.event_data.ParentProcessName:(*\\wmiprvse.exe)
      OR process.name:"wmic.exe"
      OR winlog.event_data.NewProcessName:(*\\wmic.exe)
    )
  group_by: ["host.name","process.name"]
  threshold: 1
  severity: medium
  category: lateral

- id: suspicious_svchost
  description: svchost.exe spawning scripting/LOL processes
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4688 OR winlog.event_id:4688)
    AND (
      process.parent.name:"svchost.exe" OR winlog.event_data.ParentProcessName:(*\\svchost.exe)
    )
    AND (
      process.name:(powershell.exe cmd.exe wscript.exe cscript.exe mshta.exe rundll32.exe regsvr32.exe)
      OR winlog.event_data.NewProcessName:(*\\powershell.exe *\\cmd.exe *\\wscript.exe *\\cscript.exe *\\mshta.exe *\\rundll32.exe *\\regsvr32.exe)
    )
  group_by: ["host.name","process.name"]
  threshold: 1
  severity: high
  category: endpoint

- id: powershell_web_dl
  description: PowerShell web download usage (Invoke-WebRequest/DownloadString)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(4104 OR 4688) OR winlog.event_id:(4104 OR 4688)) AND (
      message:(*Invoke-WebRequest* OR *iwr* OR *DownloadString*)
      OR process.command_line:(*Invoke-WebRequest* OR *iwr* OR *DownloadString*)
      OR winlog.event_data.CommandLine:(*Invoke-WebRequest* OR *iwr* OR *DownloadString*)
    )
  group_by: ["host.name","user.name"]
  threshold: 1
  severity: medium
  category: powershell

- id: ps_transcription_off
  description: PowerShell transcription disabled
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4104 OR winlog.event_id:4104)
    AND message:"Transcription disabled"
  group_by: ["host.name"]
  threshold: 1
  severity: medium
  category: powershell

- id: scriptblock_base64
  description: Large base64 chunk observed in ScriptBlock
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4104 OR winlog.event_id:4104)
    AND message:/[A-Za-z0-9+/]{200,}={0,2}/
  group_by: ["host.name"]
  threshold: 1
  severity: medium
  category: powershell

- id: vpn_geo_impossible
  description: Logins from far-apart locations in short time (post-process correlation may apply)
  index: "vpn-*"
  time_field: "@timestamp"
  kql: 'event:login AND outcome:success'
  group_by: ["user.name"]
  threshold: 2
  severity: medium
  category: network

- id: firewall_deny_burst
  description: Burst of firewall denies to same destination
  index: "firewall-*"
  time_field: "@timestamp"
  kql: 'action:blocked'
  group_by: ["destination.ip"]
  threshold: 5
  severity: low
  category: network

- id: m365_mfa_fatigue
  description: Multiple MFA denials for the same user (Microsoft 365)
  index: "o365-*"
  time_field: "@timestamp"
  kql: 'Operation:"UserLoginFailed" AND ResultStatus:"MFA Denied"'
  group_by: ["UserId"]
  threshold: 3
  severity: medium
  category: cloud

- id: m365_mail_forward_rule
  description: Mailbox forwarding rule created
  index: "o365-*"
  time_field: "@timestamp"
  kql: 'Operation:"New-InboxRule" AND Parameters:"ForwardTo"'
  group_by: ["UserId"]
  threshold: 1
  severity: medium
  category: cloud


# ===== Phase 13 — Detection Coverage Expansion =====
# Credential Access

- id: lsass_access
  description: Process accessing LSASS memory (Sysmon Event 10, TargetImage lsass.exe)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:10 OR winlog.event_id:10)
    AND (provider.name:"Microsoft-Windows-Sysmon" OR winlog.provider_name:"Microsoft-Windows-Sysmon")
    AND (winlog.event_data.TargetImage:(*\\lsass.exe))
  group_by: ["host.name","winlog.event_data.SourceImage"]
  threshold: 1
  severity: critical
  category: credential_access

- id: credential_dumping_tools
  description: Known credential dumping tool names in process creation (mimikatz, procdump, secretsdump)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(4688 OR 1) OR winlog.event_id:(4688 OR 1))
    AND (
      process.name:(mimikatz.exe procdump.exe procdump64.exe secretsdump.exe lazagne.exe)
      OR process.executable:(*\\mimikatz* *\\procdump* *\\secretsdump* *\\lazagne*)
      OR winlog.event_data.NewProcessName:(*\\mimikatz* *\\procdump* *\\secretsdump* *\\lazagne*)
      OR process.command_line:(*mimikatz* OR *sekurlsa* OR *lsadump* OR *kerberos::*)
      OR winlog.event_data.CommandLine:(*mimikatz* OR *sekurlsa* OR *lsadump* OR *kerberos::*)
    )
  group_by: ["host.name","process.name"]
  threshold: 1
  severity: critical
  category: credential_access

- id: ntds_dit_access
  description: Access to ntds.dit or SYSTEM hive (credential theft from domain controller)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(4663 OR 11) OR winlog.event_id:(4663 OR 11))
    AND (
      winlog.event_data.ObjectName:(*ntds.dit* OR *SYSTEM*)
      OR winlog.event_data.TargetFilename:(*ntds.dit* OR *\\config\\SYSTEM*)
      OR message:(*ntds.dit* OR *vssadmin* OR *ntdsutil*)
    )
  group_by: ["host.name"]
  threshold: 1
  severity: critical
  category: credential_access

# Lateral Movement

- id: psexec_usage
  description: PsExec service installation or named pipe creation
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (
      ((event.code:7045 OR winlog.event_id:7045) AND winlog.event_data.ServiceName:(*PSEXESVC* OR *psexec*))
      OR
      ((event.code:(17 OR 18) OR winlog.event_id:(17 OR 18))
        AND (provider.name:"Microsoft-Windows-Sysmon" OR winlog.provider_name:"Microsoft-Windows-Sysmon")
        AND winlog.event_data.PipeName:(*PSEXESVC* OR *psexec*))
    )
  group_by: ["host.name"]
  threshold: 1
  severity: high
  category: lateral

- id: rdp_brute_force
  description: Multiple RDP logon failures (4625 LogonType 10)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4625 OR winlog.event_id:4625)
    AND winlog.event_data.LogonType:10
  group_by: ["winlog.event_data.IpAddress"]
  threshold: 5
  severity: high
  category: lateral

- id: remote_service_install
  description: Service installed remotely (Event 7045 — suspicious service paths)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:7045 OR winlog.event_id:7045)
    AND NOT winlog.event_data.ImagePath:(*\\Windows\\* OR *\\Microsoft\\*)
  group_by: ["host.name","winlog.event_data.ServiceName"]
  threshold: 1
  severity: high
  category: lateral

# Defence Evasion

- id: event_log_cleared
  description: Security or System event log cleared (Event 1102 or 104)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(1102 OR 104) OR winlog.event_id:(1102 OR 104))
  group_by: ["host.name"]
  threshold: 1
  severity: high
  category: evasion

- id: defender_tamper
  description: Windows Defender real-time protection disabled or exclusion added
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:(5001 OR 5010 OR 5007) OR winlog.event_id:(5001 OR 5010 OR 5007))
    AND (winlog.channel:"Microsoft-Windows-Windows Defender/Operational" OR channel:"Microsoft-Windows-Windows Defender/Operational")
  group_by: ["host.name"]
  threshold: 1
  severity: high
  category: evasion

- id: amsi_bypass
  description: AMSI bypass patterns detected in PowerShell ScriptBlock
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:4104 OR winlog.event_id:4104)
    AND (winlog.channel:"Microsoft-Windows-PowerShell/Operational" OR channel:"Microsoft-Windows-PowerShell/Operational")
    AND (
      message:(*AmsiUtils* OR *amsiInitFailed* OR *AmsiScanBuffer* OR *SetProtection* OR *Disable-Amsi*)
    )
  group_by: ["host.name"]
  threshold: 1
  severity: critical
  category: evasion

- id: timestomp_detected
  description: File creation time modified (Sysmon Event 2 — timestomping)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:2 OR winlog.event_id:2)
    AND (provider.name:"Microsoft-Windows-Sysmon" OR winlog.provider_name:"Microsoft-Windows-Sysmon")
  group_by: ["host.name","winlog.event_data.Image"]
  threshold: 1
  severity: medium
  category: evasion

# Persistence

- id: service_install_suspicious
  description: Service installed with suspicious path (temp, appdata, public)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:7045 OR winlog.event_id:7045)
    AND (
      winlog.event_data.ImagePath:(*\\temp\\* OR *\\tmp\\* OR *\\appdata\\* OR *\\public\\* OR *\\downloads\\*)
    )
  group_by: ["host.name","winlog.event_data.ServiceName"]
  threshold: 1
  severity: high
  category: persistence

- id: registry_run_key
  description: Run/RunOnce registry modification (Sysmon Event 13)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:13 OR winlog.event_id:13)
    AND (provider.name:"Microsoft-Windows-Sysmon" OR winlog.provider_name:"Microsoft-Windows-Sysmon")
    AND (
      winlog.event_data.TargetObject:(*\\Run\\* OR *\\RunOnce\\*)
    )
  group_by: ["host.name","winlog.event_data.Image"]
  threshold: 1
  severity: high
  category: persistence

- id: startup_folder_write
  description: File written to Startup folder (Sysmon Event 11)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:11 OR winlog.event_id:11)
    AND (provider.name:"Microsoft-Windows-Sysmon" OR winlog.provider_name:"Microsoft-Windows-Sysmon")
    AND (
      winlog.event_data.TargetFilename:(*\\Start Menu\\Programs\\Startup\\* OR *\\Startup\\*)
    )
  group_by: ["host.name","winlog.event_data.Image"]
  threshold: 1
  severity: high
  category: persistence

# Exfiltration

- id: dns_tunnel_volume
  description: High volume of DNS queries to single domain (possible DNS tunneling)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:22 OR winlog.event_id:22)
    AND (provider.name:"Microsoft-Windows-Sysmon" OR winlog.provider_name:"Microsoft-Windows-Sysmon")
  group_by: ["host.name","winlog.event_data.QueryName"]
  threshold: 50
  severity: high
  category: exfiltration

- id: large_outbound_transfer
  description: Unusual outbound network connection volume (Sysmon Event 3)
  index: "tinysocs-winlog-*"
  time_field: "@timestamp"
  kql: >
    (event.code:3 OR winlog.event_id:3)
    AND (provider.name:"Microsoft-Windows-Sysmon" OR winlog.provider_name:"Microsoft-Windows-Sysmon")
    AND winlog.event_data.Initiated:true
    AND NOT winlog.event_data.DestinationIp:(10.* OR 172.16.* OR 192.168.* OR 127.0.0.1 OR "::1")
  group_by: ["host.name","winlog.event_data.Image"]
  threshold: 100
  severity: medium
  category: exfiltration


