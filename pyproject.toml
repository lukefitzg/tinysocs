[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "tinysocs"
version = "0.11.0"
description = "TinySocs — a lightweight, privacy-first, federated SIEM/analyst assistant."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Luke FitzGerald" }]
license = { text = "BSL-1.1" }
keywords = ["siem", "security", "opensearch", "detections", "llm"]
dependencies = [
  "httpx>=0.27.2,<0.28",
  "requests>=2.31,<3",
  "PyYAML>=6.0.2,<7",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "opensearch-py>=2.6,<3",
  "anthropic>=0.39,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0.1,<2",
  "cryptography>=42,<46",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "mypy>=1.10",
  "ruff>=0.6",
  "types-requests",
  "types-PyYAML",
]

[project.scripts]
tinysocs-node = "tinysocs.api.node:cli"
tinysocs-master = "tinysocs.orchestrator.master:cli"
tinysocs-quickstart = "tinysocs.launcher.quickstart:cli"
tinysocs-daily-summary = "tinysocs.reporting.daily_summary:main"


# Tell Hatch/pip that the package is under src/
[tool.hatch.build.targets.wheel]
packages = ["src/tinysocs"]

[tool.hatch.build.targets.sdist]
include = [
  "src/tinysocs",
  "scripts",
  "support",
  "integrations",
  "LICENSE",
  "README.md"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E","F","W","I","N","UP"]
# E501: line length isn't a correctness signal here.
# E402: dashboard.py/node.py/bot.py deliberately scope imports next to the
# section that uses them across large files — not import-order carelessness.
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = false
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
